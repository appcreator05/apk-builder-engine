name: Build Android APK

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK Platforms
      run: |
        echo "y" | sdkmanager "platforms;android-36" "build-tools;34.0.0"

    - name: Inject App Details & Customizations
      run: |
        APP_NAME="${{ github.event.client_payload.app_name }}"
        PKG_NAME="${{ github.event.client_payload.pkg_name }}"
        APP_URL="${{ github.event.client_payload.app_url }}"
        VERSION_NAME="${{ github.event.client_payload.version_name }}"
        VERSION_CODE="${{ github.event.client_payload.version_code }}"
        TARGET_SDK="${{ github.event.client_payload.target_sdk }}"
        ORIENTATION="${{ github.event.client_payload.orientation }}"
        LOGO_INFO="${{ github.event.client_payload.logo_info }}"
        SPLASH_INFO="${{ github.event.client_payload.splash_info }}"
        CACHE_MODE="${{ github.event.client_payload.cache_mode }}"
        
        # ফিচারগুলোর স্ট্যাটাস রিসিভ করা (true/false)
        TXT_SEL="${{ github.event.client_payload.features.text }}"
        CONF_EXIT="${{ github.event.client_payload.features.exit }}"
        GPS_PROMPT="${{ github.event.client_payload.features.gps }}"
        REFRESH="${{ github.event.client_payload.features.refresh }}"
        WALLET_SUP="${{ github.event.client_payload.features.wallet }}"

        echo "Building App Name: $APP_NAME"
        echo "Package Name: $PKG_NAME"
        echo "Target URL: $APP_URL"
        echo "Version: $VERSION_NAME (Code: $VERSION_CODE)"
        echo "Target SDK: $TARGET_SDK"
        echo "Orientation: $ORIENTATION"
        echo "Cache Mode: $CACHE_MODE"
        echo "Features -> Text Sel: $TXT_SEL | Confirm Exit: $CONF_EXIT | Wallet Supp: $WALLET_SUP"

        # ১. ইউজারের দেওয়া নিজস্ব Package Name দিয়ে build.gradle এবং MainActivity.java আপডেট করা
        if [ ! -z "$PKG_NAME" ]; then
          echo "Updating package name to: $PKG_NAME"
          
          # build.gradle ফাইলে applicationId পরিবর্তন
          sed -i "s/applicationId \"com.creator.app\"/applicationId \"$PKG_NAME\"/g" app/build.gradle
          
          # MainActivity.java ফাইলের প্যাকেজ নাম পরিবর্তন
          sed -i "s/package com.creator.app;/package $PKG_NAME;/g" app/src/main/java/com/creator/app/MainActivity.java
        fi

        # ২. জাভা ফাইলে ওয়েবসাইটের URL বসানো
        sed -i "s|DEFAULT_URL_HERE|$APP_URL|g" app/src/main/java/com/creator/app/MainActivity.java

        # ৩. ক্যাশ মোড ডাইনামিক্যালি জাভা ফাইলে আপডেট করা
        if [ "$CACHE_MODE" == "no_cache" ]; then
          sed -i 's|webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);|webSettings.setCacheMode(WebSettings.LOAD_NO_CACHE);|g' app/src/main/java/com/creator/app/MainActivity.java
        elif [ "$CACHE_MODE" == "highly_cached" ]; then
          sed -i 's|webSettings.setCacheMode(WebSettings.LOAD_DEFAULT);|webSettings.setCacheMode(WebSettings.LOAD_CACHE_ELSE_NETWORK);|g' app/src/main/java/com/creator/app/MainActivity.java
        fi

        # ৪. build.gradle ফাইলে Version Name, Version Code এবং Target SDK ডাইনামিক্যালি আপডেট করা
        if [ ! -z "$VERSION_NAME" ]; then
          sed -i "s/versionName \"1.0.0\"/versionName \"$VERSION_NAME\"/g" app/build.gradle
          sed -i "s/versionName '1.0.0'/versionName '$VERSION_NAME'/g" app/build.gradle
        fi

        if [ ! -z "$VERSION_CODE" ]; then
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" app/build.gradle
        fi

        if [ ! -z "$TARGET_SDK" ]; then
          sed -i "s/targetSdk 37/targetSdk $TARGET_SDK/g" app/build.gradle
          sed -i "s/compileSdk 37/compileSdk $TARGET_SDK/g" app/build.gradle
        fi

        # ৫. যদি ইউজার গ্যালারি থেকে ছবি আপলোড করে (Base64 ফরম্যাট), সেটি লোগো ফোল্ডারে সেভ করার প্রসেস
        if [[ "$LOGO_INFO" == data:image* ]]; then
          echo "$LOGO_INFO" | sed 's/^.*, //' | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          echo "Custom logo applied successfully!"
        fi

    - name: Set up Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Release APK with Gradle
      run: gradle assembleRelease

    - name: Find and Verify APK
      run: |
        echo "Searching for generated APK files..."
        find app/build/outputs/apk/ -name "*.apk"

    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/release/app-release.apk
          app/build/outputs/apk/**/*.apk
        tag_name: app-${{ github.event.client_payload.pkg_name }}-${{ github.run_number }}
        name: "${{ github.event.client_payload.app_name }} (${{ github.event.client_payload.pkg_name }})"
        body: "Automated Web-to-APK Build for Package: ${{ github.event.client_payload.pkg_name }} | Version: ${{ github.event.client_payload.version_name }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
