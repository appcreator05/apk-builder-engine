name: Build Android APK

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Inject App Details
      run: |
        # Pull data from GitHub event payload
        APP_NAME="${{ github.event.client_payload.app_name }}"
        PKG_NAME="${{ github.event.client_payload.pkg_name }}"
        APP_URL="${{ github.event.client_payload.app_url }}"

        echo "Building App Name: $APP_NAME"
        echo "Package Name: $PKG_NAME"
        echo "Target URL: $APP_URL"

        # Here you can use sed or python script to update strings.xml or MainActivity.java dynamically
        # For example, replacing URL in MainActivity.java
        sed -i "s|DEFAULT_URL_HERE|$APP_URL|g" app/src/main/java/com/creator/app/MainActivity.java

    - name: Build Release APK
      run: |
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/app-release.apk
        tag_name: app-v-${{ github.run_number }}
        name: "Generated App v${{ github.run_number }}"
        body: "Automated Web-to-APK Build by GitHub Actions."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
