name: Build Android APK

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install SDK Platforms
      run: |
        echo "y" | sdkmanager "platforms;android-36" "build-tools;34.0.0"

    - name: Inject App Details
      run: |
        APP_NAME="${{ github.event.client_payload.app_name }}"
        PKG_NAME="${{ github.event.client_payload.pkg_name }}"
        APP_URL="${{ github.event.client_payload.app_url }}"

        echo "Building App Name: $APP_NAME"
        echo "Package Name: $PKG_NAME"
        echo "Target URL: $APP_URL"

        sed -i "s|DEFAULT_URL_HERE|$APP_URL|g" app/src/main/java/com/creator/app/MainActivity.java

    - name: Set up Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Build Release APK with Gradle
      run: gradle assembleRelease

    - name: Verify APK Exists
      run: |
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          echo "APK found successfully!"
        else
          echo "Error: APK file not found!"
          exit 1
        fi

    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/app-release.apk
        tag_name: app-v-${{ github.run_number }}
        name: "Generated App v${{ github.run_number }}"
        body: "Automated Web-to-APK Build by GitHub Actions."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
